<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preloader</title>
<style>
  :root{
    --bg:#f6f1ec;
    --ink:#1e2e4f;
    --line:#8a8078;
    --grid:#e4ddd5;
    --accent:#1e6fd9;
    --signature:#c17a4e;
    --btn-base:#000000;      /* button color before hover */
    --btn-hover:#fce877;     /* hover color (yellow from your reference) */
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
  }

  .stage-shell{
    position:relative;
    width:100%;
    height:100vh;
    background-color:var(--bg);
    overflow:hidden;
    --mx:-500px;
    --my:-500px;
  }

  /* black line grid */
  .grid-bg{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
    --grid-line:rgba(60,40,30,0.055);   /* very faint, like the inspo */
    --grid-size:33px;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size:var(--grid-size) var(--grid-size);
    -webkit-mask-image:radial-gradient(ellipse 75% 80% at 50% 45%, #000 35%, rgba(0,0,0,0.35) 100%);
    mask-image:radial-gradient(ellipse 75% 80% at 50% 45%, #000 35%, rgba(0,0,0,0.35) 100%);
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .v-line{
    position:absolute;
    top:0;
    width:2px;
    height:100%;
    background:var(--line);
  }
  .v-line.left{ left:60px; }
  .v-line.right{ right:60px; }

  .guide-line{
    position:absolute;
    top:50%;
    height:2px;
    background:var(--line);
    transform:translateY(-50%);
  }
  .guide-line.left{ left:60px; width:0; transform-origin:left center; }
  .guide-line.right{ right:60px; width:0; transform-origin:right center; }

  .signature-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:260px;
  }
  .signature-wrap svg{ width:100%; height:auto; overflow:visible; }
  .sig-path{
    fill:none;
    stroke:var(--signature);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .hero-name{
    position:relative;
    text-align:center;
    z-index:5;
  }
  .hero-name h1{
    font-size:clamp(2.5rem, 8vw, 6rem);
    font-weight:800;
    letter-spacing:-0.02em;
    color:var(--ink);
    line-height:0.95;
    text-transform:uppercase;
    position:relative;
    display:inline-block;
  }
  .hero-name h1 .line{ display:block; overflow:hidden; }
  .hero-name h1 .line > span{
    display:inline-block;
    transform:translateY(110%);
    opacity:0;
  }
  /* once the reveal is finished, let hovered letters grow past the line box */
  .hero-name.revealed h1 .line{ overflow:visible; }

  .word-inner{ display:inline-block; }

  /* ---------- HOVER: glow + grow ---------- */
  .letter{
    display:inline-block;
    transform-origin:center bottom;
    transition:
      transform 0.25s cubic-bezier(.2,.8,.2,1),
      color 0.25s ease,
      text-shadow 0.25s ease;
    cursor:default;
    will-change:transform;
  }
  .hero-name.revealed .letter.hot{
    transform:scale(1.12) translateY(-2px);
    text-shadow:0 0 8px rgba(0,0,0,0.22);
  }
  .hero-name.revealed .letter.near{
    transform:scale(1.04);
  }

  .side-label{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:1.7rem;
    color:#555;
    opacity:0;
    white-space:nowrap;
  }
  .side-label.left{ text-align:right; }
  .side-label.right{ text-align:left; }

  .chat-bubble{
    position:fixed;
    left:0;
    top:0;
    background:var(--accent);
    color:#fff;
    padding:14px 22px;
    border-radius:30px;
    font-size:1rem;
    font-weight:500;
    opacity:0;
    transform:translate(-9999px,-9999px) scale(0.6);
    box-shadow:0 8px 20px rgba(30,111,217,0.25);
    pointer-events:none;
    white-space:nowrap;
    z-index:20;
    will-change:transform;
  }
  .chat-bubble .cursor{
    display:inline-block;
    width:2px;
    background:#fff;
    margin-left:2px;
    animation:blink 0.8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- SCROLL BUTTON ---------- */
  .Btn{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    position:absolute;
    bottom:60px;
    left:50%;
    overflow:hidden;
    box-shadow:2px 2px 10px rgba(0,0,0,0.25);
    background-color:var(--btn-base);
    opacity:0;
    transform:translateX(-50%) translateY(30px);
    z-index:6;
    pointer-events:none;
  }
  .Btn.shown{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
    transition:
      opacity 0.6s ease,
      transform 0.6s cubic-bezier(.2,.8,.2,1),
      width .35s cubic-bezier(.2,.8,.2,1),
      border-radius .35s ease,
      background-color .3s ease;
  }
  .Btn .sign{
    width:100%;
    height:100%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:width .35s cubic-bezier(.2,.8,.2,1), padding .35s ease;
  }

  /* moving arrow SVG: two stacked arrows scroll down in a loop */
  .Btn .sign svg{
    width:30px;
    height:30px;
    flex-shrink:0;
    overflow:visible;
  }
  /* mouse scroll icon */
  .mouse-body,
  .mouse-wheel{
    fill:none;
    stroke:#ffffff;
    stroke-width:2;
    stroke-linecap:round;
    transition:stroke .3s ease;
  }
  .mouse-wheel{
    transform-box:fill-box;
    transform-origin:center;
    animation:wheelMove 1.6s ease-in-out infinite;
  }
  @keyframes wheelMove{
    0%  { transform:translateY(-3px); opacity:0; }
    30% { opacity:1; }
    80% { transform:translateY(8px); opacity:0; }
    100%{ opacity:0; }
  }

  .Btn .text{
    position:absolute;
    right:0%;
    width:0%;
    opacity:0;
    color:#000;
    font-size:1.1em;
    font-weight:700;
    transition:opacity .3s ease .05s, width .35s cubic-bezier(.2,.8,.2,1);
    white-space:nowrap;
  }
  .Btn.shown:hover{
    width:135px;
    border-radius:40px;
    background-color:var(--btn-hover);
  }
  .Btn.shown:hover .sign{ width:36%; padding-left:6px; }
  .Btn.shown:hover .mouse-body,
  .Btn.shown:hover .mouse-wheel{ stroke:#000; }
  .Btn.shown:hover .text{ opacity:1; width:64%; padding-right:12px; }
</style>
</head>
<body>

<div class="stage-shell" id="stageShell">
  <div class="grid-bg"></div>
  <div class="stage" id="stage">

    <div class="v-line left"></div>
    <div class="v-line right"></div>

    <div class="guide-line left" id="lineLeft"></div>
    <div class="guide-line right" id="lineRight"></div>

    <div class="signature-wrap" id="signatureWrap">
      <svg viewBox="0 0 260 90">
        <path class="sig-path" d="M25,46 C50,25 70,20 84,20 C110,20 140,24 176,32" />
        <path class="sig-path" d="M176,32 L182,29" />
        <path class="sig-path" d="M76,52 C74,36 76,18 82,16 C88,18 86,36 88,50
             C90,58 98,58 100,45 C102,32 112,32 114,45 C116,58 124,58 126,45
             C128,34 138,32 142,45 C144,54 152,54 154,44" />
        <path class="sig-path" d="M25,46 C20,54 22,60 30,60 C60,64 108,62 148,60 C168,58 190,56 212,54 C220,53 226,52.5 230,51.5
             C234,50.5 237,52.5 235,55.5 C233,58 229,56.5 230,54" />
        <path class="sig-path" d="M166,63 L168,63" />
        <path class="sig-path" d="M171,64 L173,64" />
      </svg>
    </div>

    <div class="side-label left" id="labelLeft">Web Developer.   </div>
    <div class="side-label right" id="labelRight"> Navi Mumbai, India</div>

    <div class="hero-name" id="heroName">
      <h1 aria-label="Aadarsh Baranwal">
        <span class="line"><span id="w1" aria-hidden="true"><span class="word-inner">AADARSH</span></span></span>
        <span class="line"><span id="w2" aria-hidden="true"><span class="word-inner">BARANWAL</span></span></span>
      </h1>
    </div>

    <div class="chat-bubble" id="chatBubble">
      <span id="chatText"></span><span class="cursor">&nbsp;</span>
    </div>

    <button class="Btn" id="menuBtn" type="button" aria-label="Dive in">
      <div class="sign">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <rect class="mouse-body" x="12" y="5" width="16" height="30" rx="8"></rect>
          <line class="mouse-wheel" x1="20" y1="12" x2="20" y2="16"></line>
        </svg>
      </div>
      <div class="text">Dive in</div>
    </button>

  </div>
</div>

<script>
const sigPaths  = document.querySelectorAll('.sig-path');
const signatureWrap = document.getElementById('signatureWrap');
const lineLeft  = document.getElementById('lineLeft');
const lineRight = document.getElementById('lineRight');
const chatBubble= document.getElementById('chatBubble');
const chatText  = document.getElementById('chatText');
const w1 = document.getElementById('w1');
const w2 = document.getElementById('w2');
const labelLeft = document.getElementById('labelLeft');
const labelRight= document.getElementById('labelRight');
const menuBtn   = document.getElementById('menuBtn');
const heroName  = document.getElementById('heroName');
const stage     = document.getElementById('stage');

sigPaths.forEach((path) => {
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
});

function drawSignature(){
  sigPaths.forEach((path, i) => {
    setTimeout(() => {
      path.style.transition = 'stroke-dashoffset 0.5s ease';
      path.style.strokeDashoffset = '0';
    }, i * 150);
  });
}

function positionSideLabels(){
  const gap = 40;
  const stageRect = stage.getBoundingClientRect();
  const heroRect  = heroName.getBoundingClientRect();
  labelLeft.style.right = (stageRect.width - (heroRect.left - stageRect.left) + gap) + 'px';
  labelLeft.style.left  = 'auto';
  labelRight.style.left = ((heroRect.right - stageRect.left) + gap) + 'px';
  labelRight.style.right= 'auto';
}
positionSideLabels();
window.addEventListener('resize', positionSideLabels);

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight - 100;
let bubbleX = mouseX;
let bubbleY = mouseY;
let followActive = false;

const stageShell = document.getElementById('stageShell');
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  stageShell.style.setProperty('--mx', e.clientX + 'px');
  stageShell.style.setProperty('--my', e.clientY + 'px');
});

menuBtn.addEventListener('click', () => {
  window.location.href = 'index.html';
});

function trailLoop(){
  bubbleX += (mouseX - bubbleX) * 0.15;
  bubbleY += (mouseY - bubbleY) * 0.15;
  if(followActive){
    chatBubble.style.transform = `translate(${bubbleX + 24}px, ${bubbleY + 24}px) scale(1)`;
  }
  requestAnimationFrame(trailLoop);
}
requestAnimationFrame(trailLoop);

function typeText(el, text, speed, cb){
  let i = 0;
  const interval = setInterval(() => {
    el.textContent = text.slice(0, i+1);
    i++;
    if(i >= text.length){
      clearInterval(interval);
      if(cb) cb();
    }
  }, speed);
}

function deleteText(el, speed, cb){
  const interval = setInterval(() => {
    const current = el.textContent;
    if(current.length === 0){
      clearInterval(interval);
      if(cb) cb();
      return;
    }
    el.textContent = current.slice(0, -1);
  }, speed);
}

function revealWord(el){
  el.style.transition = 'transform 0.7s cubic-bezier(.2,.8,.2,1), opacity 0.5s ease';
  el.style.transform = 'translateY(0)';
  el.style.opacity = '1';
}

function playSequence(){
  const DRAW_START        = 300;
  const HOLD_AFTER_DRAW   = 400;
  const SLIDE_DURATION    = 900;
  const BUFFER_AFTER_SLIDE= 100;

  chatBubble.style.transition = 'opacity 0.4s ease';
  setTimeout(() => {
    bubbleX = mouseX;
    bubbleY = mouseY;
    followActive = true;
    chatBubble.style.opacity = '1';
    typeText(chatText, 'Hey there!', 70);
  }, 200);

  setTimeout(drawSignature, DRAW_START);

  const drawFinish = DRAW_START + (sigPaths.length - 1) * 150 + 500;
  const slideStart = drawFinish + HOLD_AFTER_DRAW;
  setTimeout(() => {
    signatureWrap.style.transition = `top ${SLIDE_DURATION}ms cubic-bezier(.2,.8,.2,1), transform ${SLIDE_DURATION}ms cubic-bezier(.2,.8,.2,1)`;
    signatureWrap.style.top = '16%';
    signatureWrap.style.transform = 'translate(-50%,0)';
  }, slideStart);

  const OFFSET = slideStart + SLIDE_DURATION + BUFFER_AFTER_SLIDE;

  setTimeout(() => {
    lineLeft.style.transition = 'width 0.9s cubic-bezier(.2,.8,.2,1)';
    lineRight.style.transition = 'width 0.9s cubic-bezier(.2,.8,.2,1)';
    const gap = 36;
    const stageRect = stage.getBoundingClientRect();
    const leftLabelRect = labelLeft.getBoundingClientRect();
    const rightLabelRect = labelRight.getBoundingClientRect();
    lineLeft.style.width  = Math.max(0, (leftLabelRect.left - stageRect.left) - gap - 60) + 'px';
    lineRight.style.width = Math.max(0, (stageRect.right - rightLabelRect.right) - gap - 60) + 'px';
  }, OFFSET + 200);

  setTimeout(() => revealWord(w1), OFFSET + 350);
  setTimeout(() => revealWord(w2), OFFSET + 500);

  // enable hover glow/grow once the slide-up reveal has finished
  setTimeout(() => heroName.classList.add('revealed'), OFFSET + 500 + 800);

  setTimeout(() => {
    labelLeft.style.transition = 'opacity 0.6s ease';
    labelRight.style.transition = 'opacity 0.6s ease';
    labelLeft.style.opacity = '1';
    labelRight.style.opacity = '1';
  }, OFFSET + 800);

  const RETYPE_TRIGGER = OFFSET + 700;
  const DELETE_SPEED = 30;
  const GAP_BETWEEN  = 150;
  const TYPE_SPEED   = 35;
  const retypeDuration = ('Hey there!'.length * DELETE_SPEED) + GAP_BETWEEN + ('Curious? Have a look!'.length * TYPE_SPEED);

  setTimeout(() => {
    deleteText(chatText, DELETE_SPEED, () => {
      setTimeout(() => typeText(chatText, 'Curious? Have a look!', TYPE_SPEED), GAP_BETWEEN);
    });
  }, RETYPE_TRIGGER);

  const menuAppearsAt = RETYPE_TRIGGER + retypeDuration + 500;
  setTimeout(() => menuBtn.classList.add('shown'), menuAppearsAt);

  setTimeout(() => {
    followActive = false;
    chatBubble.style.opacity = '0';
    setTimeout(() => { chatBubble.style.display = 'none'; }, 400);
  }, menuAppearsAt + 500);
}

function splitIntoLetters(el){
  const text = el.textContent;
  el.innerHTML = '';
  text.split('').forEach(ch => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(span);
  });
}

/* ---- hover: hovered letter glows + grows, neighbours swell a little ---- */
function setupLetterHover(){
  document.querySelectorAll('.word-inner').forEach(word => {
    const letters = Array.from(word.querySelectorAll('.letter'));
    letters.forEach((l, i) => {
      l.addEventListener('mouseenter', () => {
        l.classList.add('hot');
        if(letters[i-1]) letters[i-1].classList.add('near');
        if(letters[i+1]) letters[i+1].classList.add('near');
      });
      l.addEventListener('mouseleave', () => {
        l.classList.remove('hot');
        if(letters[i-1]) letters[i-1].classList.remove('near');
        if(letters[i+1]) letters[i+1].classList.remove('near');
      });
    });
  });
}

window.addEventListener('load', () => {
  document.querySelectorAll('.word-inner').forEach(splitIntoLetters);
  setupLetterHover();
  positionSideLabels();
  setTimeout(playSequence, 300);
});
</script>

</body>
</html>
